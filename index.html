<!DOCTYPE html>
<html>
<head>

<title>APBA Dice Roller</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    background:#101010;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:20px;
}

#secretBall{
    cursor:pointer;
    user-select:none;
}

#fieldArea{
    width:90%;
    margin:40px auto;
    border-radius:20px;
    overflow:hidden;

    background-image:url('images/baseball-field.jpg');
    background-size:cover;
    background-position:bottom;
}

#overlay{
    background:rgba(0,0,0,.35);
    padding:60px 20px;
}

#redDie{
    width:200px;
    filter:drop-shadow(10px 10px 10px rgba(0,0,0,.6));
}

#whiteDie{
    width:150px;
    margin-left:20px;
    filter:drop-shadow(8px 8px 8px rgba(0,0,0,.6));
}

button{
    font-size:20px;
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#statsPanel{
    width:500px;
    max-width:90%;
    margin:20px auto;
    text-align:left;
    background:rgba(255,255,255,.08);
    padding:15px;
    border-radius:10px;
}

#logWrapper{
    width:95%;
    margin:20px auto;
    background:black;
    border-radius:10px;
    padding:10px;
    overflow-x:auto;
    white-space:nowrap;
}

.timestamp{
    color:yellow;
    font-weight:bold;
}

table{
    margin:auto;
    border-collapse:collapse;
}

td{
    border:1px solid #555;
    padding:5px;
    min-width:70px;
}

@keyframes rollAnimation{

    0%{
        transform:rotate(0deg) scale(1);
    }

    25%{
        transform:rotate(-15deg) scale(1.1);
    }

    50%{
        transform:rotate(15deg) scale(1.15);
    }

    75%{
        transform:rotate(-10deg) scale(1.1);
    }

    100%{
        transform:rotate(0deg) scale(1);
    }
}

.rolling{
    animation:rollAnimation .75s ease;
}

</style>

</head>

<body>

<h1>
<span id="secretBall">⚾</span>
APBA Dice Roller
</h1>

<div id="fieldArea">

<div id="overlay">

<div>

<img id="redDie" src="images/red1.png">

<img id="whiteDie" src="images/white1.png">

</div>

<br>

<label>

<input
type="checkbox"
id="soundToggle"
checked>

Sound Effects

</label>

<br><br>

<button onclick="rollDice()">
Roll Dice
</button>

</div>

</div>

<div id="statsPanel">

<b>Statistics</b>

<br><br>

Total Rolls:
<span id="totalRolls">0</span>

<br>

Red Average:
<span id="redAverage">0.00</span>

<br>

White Average:
<span id="whiteAverage">0.00</span>

</div>

<div id="logWrapper">

<div id="logTicker">

No rolls yet.

</div>

</div>

<button onclick="clearLog()">
Clear Log
</button>

<br><br>

<div id="comboTable"></div>

<script>

const rollSound =
new Audio("sounds/dice-roll.mp3");

let rollHistory = [];

let totalRolls = 0;

let redTotal = 0;

let whiteTotal = 0;

const comboStats = {};

for(let r=1;r<=6;r++)
{
    for(let w=1;w<=6;w++)
    {
        comboStats[r + "-" + w] = 0;
    }
}

const soundToggle =
document.getElementById("soundToggle");

soundToggle.checked =
localStorage.getItem("soundEnabled")
!== "false";

soundToggle.addEventListener(
"change",
function()
{
    localStorage.setItem(
        "soundEnabled",
        soundToggle.checked
    );
});

function rollSecureDie()
{
    const limit =
        Math.floor(
            4294967296 / 6
        ) * 6;

    const array =
        new Uint32Array(1);

    while(true)
    {
        window.crypto.getRandomValues(
            array
        );

        if(array[0] < limit)
        {
            return (
                array[0] % 6
            ) + 1;
        }
    }
}

function formatTime()
{
    return new Date()
        .toLocaleTimeString();
}

function updateStats()
{
    document.getElementById(
        "totalRolls"
    ).innerText =
        totalRolls;

    if(totalRolls > 0)
    {
        document.getElementById(
            "redAverage"
        ).innerText =
        (redTotal /
         totalRolls)
         .toFixed(2);

        document.getElementById(
            "whiteAverage"
        ).innerText =
        (whiteTotal /
         totalRolls)
         .toFixed(2);
    }
}

function updateLog()
{
    document.getElementById(
        "logTicker"
    ).innerHTML =
        rollHistory.join(
            "&nbsp;&nbsp;⚾&nbsp;&nbsp;"
        );
}

function updateComboTable()
{
    let html =
    "<h2>Combination Frequency</h2><table>";

    for(let r=1;r<=6;r++)
    {
        html += "<tr>";

        for(let w=1;w<=6;w++)
        {
            html +=
            "<td>" +
            r +
            "-" +
            w +
            "<br>" +
            comboStats[
            r+"-"+w] +
            "</td>";
        }

        html += "</tr>";
    }

    html += "</table>";

    document.getElementById(
        "comboTable"
    ).innerHTML =
        html;
}

function recordRoll(red,white)
{
    totalRolls++;

    redTotal += red;

    whiteTotal += white;

    comboStats[
        red + "-" + white
    ]++;

    const timestamp =
        formatTime();

    rollHistory.unshift(
      "<span class='timestamp'>" +
      timestamp +
      "</span> " +
      red +
      "-" +
      white
    );

    if(rollHistory.length > 50)
    {
        rollHistory.pop();
    }

    updateStats();
    updateLog();
    updateComboTable();
}

function rollDice()
{
    const redDie =
        document.getElementById(
            "redDie");

    const whiteDie =
        document.getElementById(
            "whiteDie");

    redDie.classList.add(
        "rolling");

    whiteDie.classList.add(
        "rolling");

    if(soundToggle.checked)
    {
        rollSound.currentTime = 0;
        rollSound.play();
    }

    const rolling =
    setInterval(function(){

        redDie.src =
            "images/red" +
            rollSecureDie() +
            ".png";

        whiteDie.src =
            "images/white" +
            rollSecureDie() +
            ".png";

    },50);

    setTimeout(function(){

        clearInterval(
            rolling);

        const red =
            rollSecureDie();

        const white =
            rollSecureDie();

        redDie.src =
            "images/red" +
            red +
            ".png";

        whiteDie.src =
            "images/white" +
            white +
            ".png";

        recordRoll(
            red,
            white);

        redDie.classList.remove(
            "rolling");

        whiteDie.classList.remove(
            "rolling");

    },750);
}

function autoRoll(count)
{
    for(let i=0;i<count;i++)
    {
        recordRoll(
            rollSecureDie(),
            rollSecureDie()
        );
    }

    alert(
        count.toLocaleString() +
        " rolls completed."
    );
}

function clearLog()
{
    rollHistory = [];

    document.getElementById(
        "logTicker"
    ).innerHTML =
        "No rolls yet.";
}

document.getElementById(
    "secretBall"
).addEventListener(
    "click",
    function(event)
    {
        if(
            !event.ctrlKey ||
            !event.shiftKey
        )
        {
            return;
        }

        const count =
        parseInt(
            prompt(
                "Number of rolls?"
            )
        );

        if(
            isNaN(count) ||
            count < 1
        )
        {
            return;
        }

        autoRoll(count);
    }
);

updateComboTable();

</script>

</body>
</html>
