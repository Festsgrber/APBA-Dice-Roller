<!DOCTYPE html>
<html>

<head>

<title>APBA Dice Roller</title>

<style>

body{
    text-align:center;
    font-family:Arial, sans-serif;
    background-color:#101010;
    color:white;
    margin-top:20px;
}

h1{
    margin-bottom:20px;
}

#fieldArea{

    background-image:url('images/baseball-field.jpg');

    background-size:cover;
    background-position:bottom
;

    width:90%;

    margin-left:auto;
    margin-right:auto;

    margin-top:50px;

    padding-top:80px;
    padding-bottom:80px;

    border-radius:20px;

    box-shadow:0 0 20px rgba(0,0,0,.6);
}

#overlay{

    background-color:rgba(0,0,0,.35);

    padding-top:30px;
    padding-bottom:30px;

    border-radius:20px;
}

#diceContainer{
    margin-bottom:30px;
}

#redDie{

    width:200px;

    transform:rotate(-8deg);

    filter:drop-shadow(
        10px 10px 10px rgba(0,0,0,.6));
}

#whiteDie{

    width:150px;

    margin-left:20px;

    transform:rotate(8deg);

    filter:drop-shadow(
        8px 8px 8px rgba(0,0,0,.6));
}

button{

    font-size:20px;

    padding:12px 24px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    margin:5px;
}

button:hover{
    background-color:#dddddd;
}

label{
    font-size:18px;
}

@keyframes rollAnimation {

    0% {
        transform: rotate(0deg) scale(1);
    }

    25% {
        transform: rotate(-20deg) scale(1.1);
    }

    50% {
        transform: rotate(20deg) scale(1.15);
    }

    75% {
        transform: rotate(-10deg) scale(1.1);
    }

    100% {
        transform: rotate(0deg) scale(1);
    }
}

.rolling{
    animation: rollAnimation .5s ease;
}

/* Bottom Scoreboard Log */

#logWrapper{

    width:95%;
    margin:30px auto;

    background:black;

    border:2px solid #444;

    border-radius:10px;

    padding:10px;

    overflow:hidden;
}

#logTicker{

    white-space:nowrap;

    font-size:20px;

    color:white;

    text-align:left;
}

.timestamp{
    color:yellow;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>⚾ APBA Dice Roller</h1>

<div id="fieldArea">

<div id="overlay">

<div id="diceContainer">

<img id="redDie"
     src="images/red1.png">

<img id="whiteDie"
     src="images/white1.png">

</div>

<label>

<input
    type="checkbox"
    id="soundToggle"
    checked>

Sound Effects

</label>

<br><br>

<button onclick="rollDice()">
Roll Dice
</button>

</div>

</div>

<div id="logWrapper">
    <div id="logTicker">
        No rolls yet.
    </div>
</div>

<button onclick="clearLog()">
Clear Log
</button>

<script>

const rollSound =
new Audio("sounds/dice-roll.mp3");

let rollHistory = [];

const soundToggle =
document.getElementById("soundToggle");

soundToggle.checked =
localStorage.getItem("soundEnabled")
!== "false";

soundToggle.addEventListener(
"change",
function()
{
    localStorage.setItem(
        "soundEnabled",
        soundToggle.checked
    );
});

function formatTime()
{
    const now = new Date();

    return now.toLocaleTimeString(
        [],
        {
            hour:'numeric',
            minute:'2-digit',
            second:'2-digit'
        }
    );
}

function updateLog()
{
    document.getElementById(
        "logTicker"
    ).innerHTML =
        rollHistory.join(
            " &nbsp;&nbsp;&nbsp; ⚾ &nbsp;&nbsp;&nbsp; "
        );
}

function rollDice()
{
    const redDie =
        document.getElementById("redDie");

    const whiteDie =
        document.getElementById("whiteDie");

    redDie.classList.add("rolling");
    whiteDie.classList.add("rolling");

    if(soundToggle.checked)
    {
        rollSound.currentTime = 0;
        rollSound.play();
    }

    const rolling =
        setInterval(function(){

            let tempRed =
                Math.floor(Math.random()*6)+1;

            let tempWhite =
                Math.floor(Math.random()*6)+1;

            redDie.src =
                "images/red" + tempRed + ".png";

            whiteDie.src =
                "images/white" + tempWhite + ".png";

        },100);

    setTimeout(function(){

        clearInterval(rolling);

        let finalRed =
            Math.floor(Math.random()*6)+1;

        let finalWhite =
            Math.floor(Math.random()*6)+1;

        redDie.src =
            "images/red" + finalRed + ".png";

        whiteDie.src =
            "images/white" + finalWhite + ".png";

        const timestamp =
            formatTime();

        rollHistory.unshift(
            "<span class='timestamp'>" +
            timestamp +
            "</span> " +
            finalRed +
            "-" +
            finalWhite
        );

        if(rollHistory.length > 25)
        {
            rollHistory.pop();
        }

        updateLog();

        redDie.classList.remove("rolling");
        whiteDie.classList.remove("rolling");

    },1500);
}

function clearLog()
{
    rollHistory = [];

    document.getElementById(
        "logTicker"
    ).innerHTML =
        "No rolls yet.";
}

</script>

</body>

</html>
